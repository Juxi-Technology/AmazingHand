[project]
name = "AHSimulation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # dora-rs 0.5.0 matches the dora-cli 0.5.0 the kit installs.
    "dora-rs==0.5.0",
    # pyarrow 26 needs numpy>=2 and does not declare it; HandTracking pins numpy<2.
    "pyarrow<26",
    "loop-rate-limiters>=1.1.2",
    "mink>=0.0.11",
    "mujoco>=3.3.2",
    "onshape-to-robot>=1.7.5",
    "qpsolvers[quadprog]>=4.7.1",
]

[project.scripts]
AHSimulation = "mj_mink_right.main:main"

AHSimulationLeft = "mj_mink_left.main:main"
