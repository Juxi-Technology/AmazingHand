[project]
name = "HandTracking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9,<=3.12"
dependencies = [
    # dora-rs 0.5.0 matches the dora-cli 0.5.0 the kit installs.
    "dora-rs==0.5.0",
    # pyarrow 26 needs numpy>=2 and does not declare it; this package pins numpy<2.
    "pyarrow<26",
    "loop-rate-limiters>=1.1.2",
    "mediapipe==0.10.14",
    "numpy>=1.23,<2.0",
    "protobuf>=4.25.3,<5",
    "scipy>=1.9,<1.19",
]

[project.scripts]
HandTracking = "hand_tracker.main:main"
